[project]
name = "autoinsight"
version = "0.1.0"
description = "LangGraph-based automated data mining agent system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "pydantic>=2.0.0",
]
